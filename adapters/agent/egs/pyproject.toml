[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evergreenslam-egs"
description = "Command-line bridge from an agent's shell to a robot running EvergreenSLAM"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []
dynamic = ["version"]

[project.scripts]
egs = "egs.cli:main"

[tool.setuptools]
packages = ["egs"]

[tool.setuptools.package-data]
egs = ["SKILL.md"]

[tool.setuptools.dynamic]
version = { attr = "egs.__version__" }
