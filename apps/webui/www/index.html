<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EvergreenSLAM debug</title>
<style>
  :root {
    /* Unknown, and so also the colour of everywhere no scan has reached. Same value the raster
       decode leaves transparent, and the only definition of it on this side. */
    --unknown: #2b3440;
    --panel: rgba(15, 19, 25, .88);
    --line: #39434f;
    --text: #c3cad3;
    --dim: #7a8695;
    --bright: #eef2f7;
  }
  html, body { margin: 0; height: 100%; background: var(--unknown); color: var(--text);
               font: 12px/1.55 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  #view { display: block; width: 100%; height: 100%; cursor: grab; }
  #view:active { cursor: grabbing; }

  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line);
           border-radius: 6px; backdrop-filter: blur(6px); }
  h4 { margin: 10px 0 3px; font-size: 10px; font-weight: 600; color: var(--dim);
       text-transform: uppercase; letter-spacing: .09em; }
  h4:first-child { margin-top: 0; }
  b { color: var(--bright); font-weight: 600; }

  /* the display tree */
  #tree { top: 10px; left: 10px; width: 226px; max-height: calc(100% - 20px);
          overflow-y: auto; padding: 10px 12px; }
  #tree::-webkit-scrollbar { width: 6px; }
  #tree::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .row { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 1px 0;
         border-radius: 3px; user-select: none; white-space: nowrap; }
  .row:hover { background: rgba(255, 255, 255, .05); }
  .row.selected { background: rgba(255, 255, 255, .12); }
  .row .box { flex: none; width: 9px; height: 9px; border: 1px solid currentColor;
              border-radius: 2px; background: currentColor; }
  .row.off { color: var(--dim); }
  .row.off .box { background: transparent; }
  .row .name { overflow: hidden; text-overflow: ellipsis; }
  .row .note { margin-left: auto; padding-left: 8px; color: var(--dim); font-size: 11px; }
  .row .twist { flex: none; width: 9px; text-align: center; color: var(--dim); }
  .kids { margin-left: 15px; border-left: 1px solid var(--line); padding-left: 6px; }
  .hint { margin: 8px 0 0; color: var(--dim); font-size: 11px; line-height: 1.5; }

  #hud { top: 10px; left: 252px; padding: 8px 10px; pointer-events: none; }
  #backend { top: 10px; right: 10px; max-height: calc(100% - 20px); overflow-y: auto;
             padding: 10px 12px; display: none; }
  #backend table { border-collapse: collapse; }
  #backend td { padding: 0 8px 0 0; white-space: nowrap; }
  #backend td:last-child { text-align: right; color: var(--bright); }
  #scale { bottom: 10px; right: 10px; padding: 6px 8px 4px; pointer-events: none;
           text-align: center; }
  #scale .bar { height: 4px; border: 1px solid var(--text); border-top: none; margin-bottom: 2px;
                transition: width .1s; }

  .warn { color: #fbbf24; }
  .bad { color: #f87171; }
  .good { color: #4ade80; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="tree" class="panel"></div>
<div id="hud" class="panel">waiting for the pipeline…</div>
<div id="backend" class="panel"></div>
<div id="scale" class="panel"><div class="bar"></div><span id="scale-text">1 m</span></div>
<script src="view.js"></script>
<script src="raster.js"></script>
<script src="layers.js"></script>
<script src="graph.js"></script>
<script src="app.js"></script>
</body>
</html>
